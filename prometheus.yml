services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    ports:
      - 9090:9090
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - ./prometheus:/etc/prometheus
    networks:
      meet.jitsi: