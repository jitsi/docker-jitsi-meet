server {
    listen 80;
    listen [::]:80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/site;
    index index.html;

    location /media/ {
        alias /recordings/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Cache-Control "private, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
