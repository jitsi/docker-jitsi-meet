extensions:
  file_storage:
    directory: /tmp/jitsi-logs/filelog-state
    create_directory: true

receivers:
  otlp:
    protocols:
      http:
      grpc:
        endpoint: 0.0.0.0:4317

  file_log/jitsi-containers:
      include:
        - /var/lib/docker/containers/*/*-json.log
      encoding: utf-8
      start_at: end
      storage: file_storage
      operators:
        - type: json_parser
          id: docker_json
          parse_from: body
          timestamp:
            parse_from: attributes.time
            layout_type: gotime
            layout: '2006-01-02T15:04:05.999999999Z07:00'

        - type: filter
          id: only_jitsi
          expr: 'attributes?.attrs?.service != "jitsi-web" and attributes?.attrs?.service != "jitsi-jicofo" and attributes?.attrs?.service != "jitsi-jvb" and attributes?.attrs?.service != "jitsi-prosody"'

        - type: move
          id: service_name
          from: attributes.attrs.service
          to: resource["service.name"]

        - type: move
          id: log_body
          from: attributes.log
          to: body

        - type: remove
          id: remove_docker_attrs
          field: attributes.attrs

        - type: remove
          id: remove_docker_stream
          field: attributes.stream

        - type: remove
          id: remove_docker_time
          field: attributes.time

  docker_stats:
    endpoint: "unix:///var/run/docker.sock"
    api_version: "1.40"
processors:
  batch:

exporters:
  debug:
    verbosity: detailed
  otlp_http/loki:
    endpoint: "http://loki:3100/otlp"
  prometheus:
    endpoint: "0.0.0.0:9464"

service:
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [otlp, file_log/jitsi-containers]
      processors: [batch]
      exporters: [otlp_http/loki]
    metrics:
      receivers: [docker_stats]
      processors: [batch]
      exporters: [prometheus]

